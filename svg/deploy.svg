<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 355" role="img" aria-labelledby="title desc">
<title id="title">SpiderPanel deployment flow</title><desc id="desc">Four-step deployment flow from repository to build, public application port and panel access, connected by animated route lines.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090a0f"/><stop offset="1" stop-color="#170b14"/></linearGradient><linearGradient id="red"><stop stop-color="#ff7c8c"/><stop offset="1" stop-color="#ec2f4d"/></linearGradient><style>.line{stroke-dasharray:8 10;animation:flow 4s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-108}}@keyframes pulse{0%,100%{opacity:.6;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.line,.pulse{animation:none}}</style></defs>
<rect x="1" y="1" width="1198" height="353" rx="28" fill="url(#bg)" stroke="#38303a" stroke-width="2"/>
<text x="40" y="47" fill="#ff6577" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="3">DEPLOYMENT FLOW</text><text x="40" y="79" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900">From repository to panel in four steps</text>
<path d="M255 206H338M548 206H631M841 206H924" stroke="#343848" stroke-width="3" stroke-linecap="round"/><path d="M255 206H338M548 206H631M841 206H924" stroke="url(#red)" stroke-width="3" stroke-linecap="round" class="line"/>
<g font-family="Inter,Arial,sans-serif">
<g transform="translate(38 112)"><rect width="217" height="181" rx="20" fill="#151720" stroke="#393b49"/><rect x="18" y="18" width="38" height="27" rx="8" fill="#2b1720" stroke="#713142"/><text x="37" y="36" fill="#ff8391" font-size="12" font-weight="800" text-anchor="middle">01</text><text x="18" y="76" fill="#fff" font-size="17" font-weight="800">Repository</text><text x="18" y="101" fill="#9ba0b1" font-size="12">Push or fork the code</text><path d="M22 135h32v28H22zM28 129h32v28" fill="none" stroke="#ff687b" stroke-width="2.2" stroke-linejoin="round"/><circle cx="171" cy="151" r="16" fill="#24131b" stroke="#703041"/><path d="M162 151h18M171 142v18" stroke="#ff687b" stroke-width="2.5" stroke-linecap="round"/></g>
<g transform="translate(331 112)"><rect width="217" height="181" rx="20" fill="#151720" stroke="#393b49"/><rect x="18" y="18" width="38" height="27" rx="8" fill="#142633" stroke="#2a6273"/><text x="37" y="36" fill="#7be6fa" font-size="12" font-weight="800" text-anchor="middle">02</text><text x="18" y="76" fill="#fff" font-size="17" font-weight="800">Build</text><text x="18" y="101" fill="#9ba0b1" font-size="12">Docker / app startup</text><rect x="18" y="134" width="180" height="8" rx="4" fill="#292d3a"/><rect x="18" y="134" width="125" height="8" rx="4" fill="#60d9f1" class="line"/><circle cx="188" cy="138" r="4" fill="#60d9f1" class="pulse"/></g>
<g transform="translate(624 112)"><rect width="217" height="181" rx="20" fill="#151720" stroke="#393b49"/><rect x="18" y="18" width="38" height="27" rx="8" fill="#21182a" stroke="#59396a"/><text x="37" y="36" fill="#dc9aff" font-size="12" font-weight="800" text-anchor="middle">03</text><text x="18" y="76" fill="#fff" font-size="17" font-weight="800">Port 8080</text><text x="18" y="101" fill="#9ba0b1" font-size="12">Expose the app service</text><rect x="18" y="126" width="129" height="35" rx="17.5" fill="#281b2d" stroke="#674576"/><circle cx="35" cy="143.5" r="4" fill="#d988ff" class="pulse"/><text x="48" y="148" fill="#f1d9ff" font-size="12" font-weight="800">0.0.0.0:8080</text></g>
<g transform="translate(917 112)"><rect width="245" height="181" rx="20" fill="#21121a" stroke="#893044" stroke-width="1.4"/><rect x="18" y="18" width="38" height="27" rx="8" fill="#401923" stroke="#914252"/><text x="37" y="36" fill="#ff9aa6" font-size="12" font-weight="800" text-anchor="middle">04</text><text x="18" y="76" fill="#fff" font-size="17" font-weight="800">Open the panel</text><text x="18" y="101" fill="#c3a1aa" font-size="12">Use your public domain</text><rect x="18" y="126" width="178" height="35" rx="17.5" fill="url(#red)"/><text x="107" y="148" text-anchor="middle" fill="#210c12" font-size="12" font-weight="900">SPIDERPANEL ↗</text><circle cx="218" cy="143.5" r="4" fill="#ff7787" class="pulse"/></g>
</g>
<text x="1160" y="329" text-anchor="end" fill="#727687" font-family="Inter,Arial,sans-serif" font-size="10" letter-spacing="1.3">VPS · RAILWAY · DOCKER</text>
</svg>
