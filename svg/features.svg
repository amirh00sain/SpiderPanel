<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">SpiderPanel feature overview</title><desc id="desc">Six glass-style feature cards with animated status details: users, subscriptions, scanner, nodes, Telegram and operations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090a0f"/><stop offset="1" stop-color="#160b13"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8290"/><stop offset="1" stop-color="#e6294a"/></linearGradient>
  <linearGradient id="cyan"><stop stop-color="#4dc8e9"/><stop offset="1" stop-color="#8af0fa"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .card{fill:#14151d;fill-opacity:.94;stroke:#353543;stroke-width:1.4}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.5s ease-in-out infinite}.pulse2{animation-delay:-1.2s}.flow{stroke-dasharray:7 9;animation:flow 5s linear infinite}.bar{transform-box:fill-box;transform-origin:left;animation:grow 3.8s ease-in-out infinite alternate}.float{animation:float 5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.82)}50%{opacity:1;transform:scale(1.18)}}@keyframes flow{to{stroke-dashoffset:-96}}@keyframes grow{0%{transform:scaleX(.68)}100%{transform:scaleX(1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.pulse,.pulse2,.flow,.bar,.float{animation:none}}
  </style>
</defs>
<rect x="1" y="1" width="1198" height="518" rx="28" fill="url(#bg)" stroke="#38303a" stroke-width="2"/>
<text x="42" y="48" fill="#ff6678" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="3">ONE CONSOLE · MANY WORKFLOWS</text>
<text x="42" y="82" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="900">The essentials, connected.</text>
<g font-family="Inter,Arial,sans-serif">
  <g transform="translate(32 112)"><rect class="card" width="362" height="169" rx="19"/><circle cx="34" cy="35" r="18" fill="#321720" stroke="#6d2b3a"/><g transform="translate(24 25)" fill="none" stroke="#ff7182" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="5" r="5"/><path d="M2 20Q2 12 10 12Q18 12 18 20"/></g><text x="65" y="31" fill="#fff" font-size="16" font-weight="800">USERS &amp; ACCESS</text><text x="65" y="49" fill="#9599aa" font-size="11">Accounts, limits and lifecycle actions</text><rect x="22" y="78" width="318" height="1" fill="#333544"/><text x="22" y="103" fill="#b8bdca" font-size="12">Traffic · expiry · links · account actions</text><rect x="22" y="124" width="250" height="8" rx="4" fill="#292c38"/><rect x="22" y="124" width="175" height="8" rx="4" fill="url(#red)" class="bar"/><circle cx="321" cy="128" r="4" fill="#ff566b" class="pulse"/></g>
  <g transform="translate(419 112)"><rect class="card" width="362" height="169" rx="19"/><circle cx="34" cy="35" r="18" fill="#112731" stroke="#24596a"/><g transform="translate(23 24)" fill="none" stroke="#75e8fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h19v20H3zM7 7h11M7 12h11M7 17h7"/></g><text x="65" y="31" fill="#fff" font-size="16" font-weight="800">SUBSCRIPTIONS + QR</text><text x="65" y="49" fill="#9599aa" font-size="11">Shareable delivery with less friction</text><rect x="22" y="78" width="318" height="1" fill="#333544"/><text x="22" y="103" fill="#b8bdca" font-size="12">Subscription pages · config links · QR</text><g transform="translate(296 90)" fill="#e7f8fb"><rect width="43" height="43" rx="3"/><g fill="#0b1018"><path d="M5 5h12v12H5zM26 5h12v12H26zM5 26h12v12H5zM23 24h5v5h-5zM31 26h7v3h-7zM26 33h4v5h-4zM34 34h4v4h-4z"/></g></g><path d="M22 129H253" stroke="#2e4149" stroke-width="2"/><path d="M22 129H185" stroke="#75e8fa" stroke-width="2" class="flow"/></g>
  <g transform="translate(806 112)"><rect class="card" width="362" height="169" rx="19"/><circle cx="34" cy="35" r="18" fill="#28172b" stroke="#60386a"/><g transform="translate(23 24)" fill="none" stroke="#e18dff" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M17 17l5 5M11 6v6l4 2"/></g><text x="65" y="31" fill="#fff" font-size="16" font-weight="800">SCANNER TOOLS</text><text x="65" y="49" fill="#9599aa" font-size="11">TCP · IP · SNI workflows</text><rect x="22" y="78" width="318" height="1" fill="#333544"/><text x="22" y="103" fill="#b8bdca" font-size="12">Batch checks · result lists · quick copy</text><g transform="translate(22 126)" fill="none" stroke="#51405b" stroke-width="2"><path d="M0 0H318"/><path d="M0 0H225" stroke="#d982f9" class="flow"/></g><circle cx="248" cy="126" r="4" fill="#e18dff" filter="url(#glow)" class="pulse"/></g>
  <g transform="translate(32 301)"><rect class="card" width="362" height="169" rx="19"/><circle cx="34" cy="35" r="18" fill="#12262a" stroke="#2c6668"/><g transform="translate(23 24)" fill="none" stroke="#73e1d8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M3 11h16M11 3q-5 8 0 16M11 3q5 8 0 16"/></g><text x="65" y="31" fill="#fff" font-size="16" font-weight="800">NODES &amp; WORKERS</text><text x="65" y="49" fill="#9599aa" font-size="11">Health, sync and worker operations</text><rect x="22" y="78" width="318" height="1" fill="#333544"/><text x="22" y="103" fill="#b8bdca" font-size="12">Status checks · refresh · tunnel helpers</text><g transform="translate(22 130)"><rect width="10" height="10" rx="3" fill="#57d6bf" class="pulse"/><rect x="20" width="10" height="10" rx="3" fill="#57d6bf" class="pulse pulse2"/><rect x="40" width="10" height="10" rx="3" fill="#ed5269" class="pulse"/><path d="M65 5H318" stroke="#2f4747" stroke-width="2"/><path d="M65 5H250" stroke="#57d6bf" stroke-width="2" class="flow"/></g></g>
  <g transform="translate(419 301)"><rect class="card" width="362" height="169" rx="19"/><circle cx="34" cy="35" r="18" fill="#152237" stroke="#324e7c"/><path d="M23 31l11-6 11 6-11 7zM23 31v10l11 7 11-7V31M34 38v10" fill="none" stroke="#8bb7ff" stroke-width="2" stroke-linejoin="round"/><text x="65" y="31" fill="#fff" font-size="16" font-weight="800">TELEGRAM FLOWS</text><text x="65" y="49" fill="#9599aa" font-size="11">Bot operations and purchase delivery</text><rect x="22" y="78" width="318" height="1" fill="#333544"/><text x="22" y="103" fill="#b8bdca" font-size="12">Plans · approvals · channel automation</text><path d="M22 131H95L105 121 121 141 135 125H198L208 131H318" fill="none" stroke="#8bb7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="208" cy="131" r="4" fill="#8bb7ff" class="pulse"/></g>
  <g transform="translate(806 301)"><rect class="card" width="362" height="169" rx="19"/><circle cx="34" cy="35" r="18" fill="#2b1b1e" stroke="#6f3c44"/><g transform="translate(23 24)" fill="none" stroke="#ff8992" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM8 2v6M16 2v6M7 12h10M7 16h6"/></g><text x="65" y="31" fill="#fff" font-size="16" font-weight="800">RUNTIME &amp; WEB PROXY</text><text x="65" y="49" fill="#9599aa" font-size="11">Runtime helpers and Telegram Web Proxy</text><rect x="22" y="78" width="318" height="1" fill="#333544"/><text x="22" y="103" fill="#b8bdca" font-size="12">TLS / WebSocket · endpoint checks</text><rect x="22" y="123" width="120" height="25" rx="12.5" fill="#28151d" stroke="#743244"/><circle cx="35" cy="135.5" r="3" fill="#ff5c70" class="pulse"/><text x="46" y="140" fill="#ffdce1" font-size="10" font-weight="800">PORT 8080</text><text x="157" y="140" fill="#7f8597" font-size="10">Public TLS via platform</text></g>
</g>
</svg>
