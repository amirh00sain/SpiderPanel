<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">SpiderPanel high-level architecture</title><desc id="desc">A clean architecture diagram connecting the web user interface, FastAPI core, data, Xray runtime, workers and Telegram, with animated signal paths.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090a10"/><stop offset="1" stop-color="#160b14"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35151f"/><stop offset="1" stop-color="#19131d"/></linearGradient><style>.signal{stroke-dasharray:7 11;animation:flow 4.2s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.delay{animation-delay:-1.1s}@keyframes flow{to{stroke-dashoffset:-108}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.82)}50%{opacity:1;transform:scale(1.2)}}@media(prefers-reduced-motion:reduce){.signal,.pulse,.delay{animation:none}}</style></defs>
<rect x="1" y="1" width="1198" height="558" rx="28" fill="url(#bg)" stroke="#38303a" stroke-width="2"/>
<text x="42" y="47" fill="#ff6577" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="3">HIGH-LEVEL ARCHITECTURE</text><text x="42" y="79" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900">A single control plane for connected workflows</text>
<!-- Connection paths behind cards -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M260 206H415" stroke="#454958" stroke-width="3"/><path d="M260 206H415" stroke="#ff5b70" stroke-width="3" class="signal"/>
  <path d="M785 206H930" stroke="#454958" stroke-width="3"/><path d="M785 206H930" stroke="#76e3f7" stroke-width="3" class="signal"/>
  <path d="M600 272V340H220V383" stroke="#454958" stroke-width="3"/><path d="M600 272V340H220V383" stroke="#d887ff" stroke-width="3" class="signal"/>
  <path d="M600 272V383" stroke="#454958" stroke-width="3"/><path d="M600 272V383" stroke="#ff6478" stroke-width="3" class="signal"/>
  <path d="M600 340H980V383" stroke="#454958" stroke-width="3"/><path d="M600 340H980V383" stroke="#76e3f7" stroke-width="3" class="signal"/>
</g>
<g font-family="Inter,Arial,sans-serif">
  <g transform="translate(42 151)"><rect width="218" height="111" rx="18" fill="#141720" stroke="#3e414f"/><circle cx="25" cy="26" r="5" fill="#ff5b70" class="pulse"/><text x="41" y="30" fill="#fff" font-size="15" font-weight="800">WEB UI</text><text x="18" y="58" fill="#9fa5b6" font-size="12">Dashboard · login</text><text x="18" y="79" fill="#9fa5b6" font-size="12">Users · scanner · bots</text><text x="18" y="98" fill="#697184" font-size="10">HTML / CSS / JavaScript</text></g>
  <g transform="translate(415 133)"><rect width="370" height="139" rx="22" fill="url(#core)" stroke="#bd435a" stroke-width="1.6"/><rect x="1" y="1" width="368" height="137" rx="21" fill="none" stroke="#ff6d80" stroke-opacity=".18"/><circle cx="28" cy="29" r="5" fill="#ff6578" class="pulse"/><text x="45" y="34" fill="#fff" font-size="18" font-weight="900">FASTAPI CORE</text><text x="20" y="66" fill="#d3c2ca" font-size="12">Authentication · users · subscriptions · QR</text><text x="20" y="87" fill="#d3c2ca" font-size="12">Nodes · workers · scanner · Telegram</text><text x="20" y="108" fill="#d3c2ca" font-size="12">Runtime helpers · Web Proxy · Vercel relay</text><rect x="20" y="119" width="127" height="7" rx="3.5" fill="#4a2933"/><rect x="20" y="119" width="91" height="7" rx="3.5" fill="#ff6176" class="signal"/></g>
  <g transform="translate(930 151)"><rect width="228" height="111" rx="18" fill="#141a20" stroke="#345361"/><circle cx="25" cy="26" r="5" fill="#76e3f7" class="pulse delay"/><text x="41" y="30" fill="#fff" font-size="15" font-weight="800">XRAY RUNTIME</text><text x="18" y="58" fill="#a4b8c0" font-size="12">Proxy configuration</text><text x="18" y="79" fill="#a4b8c0" font-size="12">Routing · transport</text><text x="18" y="98" fill="#697e87" font-size="10">Runtime / protocol layer</text></g>
  <g transform="translate(73 383)"><rect width="294" height="105" rx="18" fill="#171622" stroke="#514060"/><circle cx="25" cy="26" r="5" fill="#d887ff" class="pulse delay"/><text x="41" y="30" fill="#fff" font-size="15" font-weight="800">APPLICATION DATA</text><text x="18" y="58" fill="#b7adbf" font-size="12">Users · settings · credentials</text><text x="18" y="79" fill="#b7adbf" font-size="12">Scanner results · persisted state</text></g>
  <g transform="translate(453 383)"><rect width="294" height="105" rx="18" fill="#171a21" stroke="#3e4758"/><circle cx="25" cy="26" r="5" fill="#ff6578" class="pulse"/><text x="41" y="30" fill="#fff" font-size="15" font-weight="800">NODES &amp; WORKERS</text><text x="18" y="58" fill="#a7adbd" font-size="12">Health checks · heartbeat</text><text x="18" y="79" fill="#a7adbd" font-size="12">Refresh · sync · tunnels</text></g>
  <g transform="translate(833 383)"><rect width="294" height="105" rx="18" fill="#151b21" stroke="#35515c"/><circle cx="25" cy="26" r="5" fill="#76e3f7" class="pulse delay"/><text x="41" y="30" fill="#fff" font-size="15" font-weight="800">TELEGRAM</text><text x="18" y="58" fill="#a7bac2" font-size="12">Bot API · sales flows</text><text x="18" y="79" fill="#a7bac2" font-size="12">Channel delivery · support</text></g>
</g>
<g fill="#fff"><circle cx="337" cy="206" r="3"/><circle cx="862" cy="206" r="3"/><circle cx="220" cy="340" r="3"/><circle cx="600" cy="340" r="3"/><circle cx="980" cy="340" r="3"/></g>
<text x="1158" y="529" text-anchor="end" fill="#717687" font-family="Inter,Arial,sans-serif" font-size="10" letter-spacing="1.2">CONCEPTUAL MAP · MODULES DEPEND ON CONFIGURATION</text>
</svg>
